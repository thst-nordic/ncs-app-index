name: Request Copilot review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'index/**/*.json'

permissions:
  pull-requests: write

jobs:
  request-copilot-review:
    name: Request Copilot code review
    runs-on: ubuntu-latest
    steps:
      - name: Request review from Copilot
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            try {
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number,
                reviewers: ['copilot-pull-request-reviewer'],
              });
              core.info(`Requested Copilot review on PR #${pull_number}`);
            } catch (error) {
              // Copilot may already be requested, or the feature may be disabled for this repo.
              core.warning(`Could not request Copilot review: ${error.message}`);
            }
